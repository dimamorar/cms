services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Docker health for the infra service monitor (dimamorar/infra M4).
    # Kept here because Dokploy rebuilds the compose from this file on deploy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/access"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - CRON_SECRET=${CRON_SECRET}
      - PREVIEW_SECRET=${PREVIEW_SECRET}
      - NODE_ENV=${NODE_ENV:-production}
      - PORTFOLIO_REVALIDATE_URL=${PORTFOLIO_REVALIDATE_URL}
      - PORTFOLIO_REVALIDATE_SECRET=${PORTFOLIO_REVALIDATE_SECRET}
    volumes:
      - media_data:/app/public/media
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  media_data:
    driver: local
